      const [showJSON, setShowJSON] = useState(false);
      const [generatingDoc, setGeneratingDoc] = useState(false);
      const [apiSteps, setApiSteps] = useState([]);
      const [showTech, setShowTech] = useState(false);
      const [downloadUrl, setDownloadUrl] = useState(null);
      const [downloadFileName, setDownloadFileName] = useState(null);
      const [lastToken, setLastToken] = useState(null);

      const brand = selectedBrand ? BRANDS[selectedBrand] : null;

      // Build JSON for Conga
      const catalogueJSON = selectedBrand && brand ? JSON.stringify({
        brand: selectedBrand,
        tagline: brand.tagline,
        description: brand.description,
        heroImg: brand.heroImg,
        highlights: brand.highlights.map(h => ({ img: h.img, caption: h.caption })),
        pageUrl: brand.pageUrl,
        products: brand.products.map(p => ({
          name: p.name, sku: p.sku, mrp: fmt(p.mrp), price: fmt(p.price),
          img: p.img, desc: p.desc,
        })),
        totalProducts: brand.products.length,
        priceRange: fmt(Math.min(...brand.products.map(p => p.price))) + " – " + fmt(Math.max(...brand.products.map(p => p.price))),
        generatedAt: new Date().toISOString(),
      }, null, 2) : "{}";

      // Conga helpers
      function addStep(s) { setApiSteps(p => [...p, { ...s, ts: new Date().toISOString() }]); }
      function updLast(u) { setApiSteps(p => { const c = [...p]; c[c.length-1] = { ...c[c.length-1], ...u }; return c; }); }

      async function handleGenerate() {
        if (!CONGA_AUTH_URL) { alert("Set Conga API credentials in source code."); return; }
        if (!selectedBrand) { alert("Select a brand first."); return; }
        setGeneratingDoc(true); setApiSteps([]); setDownloadUrl(null); setDownloadFileName(null);
        let token = null, corrId = null;

        // Step 1
        addStep({ step: 1, name: "Authenticate", method: "POST", url: CONGA_AUTH_URL, status: "pending", body: "client_credentials", resp: null, code: null });
        try {
          const b = new URLSearchParams(); b.append("grant_type","client_credentials"); b.append("client_id",CONGA_CLIENT_ID); b.append("client_secret",CONGA_CLIENT_SECRET);
          const r = await fetch(CONGA_AUTH_URL, { method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: b.toString() });
          const d = await r.json().catch(() => null);
          if (r.ok && d?.access_token) { token = d.access_token; setLastToken(token); updLast({ status:"success", code:r.status, resp: "Token received" }); }
          else { updLast({ status:"error", code:r.status, resp: JSON.stringify(d) }); setGeneratingDoc(false); return; }
        } catch(e) { updLast({ status:"error", code:"Err", resp:e.message }); setGeneratingDoc(false); return; }

        // Step 2
        const payload = { output:{generateDocumentDownload:true}, legacyOptions:{DefaultPdf:"1", OFN: selectedBrand + " Catalogue"}, TemplateSources:[{IntegrationName:"conga",fileId:CONGA_TEMPLATE_FILE_ID}], Destinations:[{IntegrationName:"conga",folderId:CONGA_DEST_FOLDER}], Locale:"en-US", JsonData: catalogueJSON };
        addStep({ step: 2, name: "Send Merge", method: "POST", url: CONGA_MERGE_URL, status: "pending", body: "JSON payload", resp: null, code: null });
        try {
          const r = await fetch(CONGA_MERGE_URL, { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body: JSON.stringify(payload) });
          const d = await r.json().catch(() => null);
          if (r.ok && d?.correlationId) { corrId = d.correlationId; updLast({ status:"success", code:r.status, resp:"correlationId: "+corrId }); }
          else { updLast({ status:"error", code:r.status, resp: JSON.stringify(d) }); setGeneratingDoc(false); return; }
        } catch(e) { updLast({ status:"error", code:"Err", resp:e.message }); setGeneratingDoc(false); return; }

        // Step 3
        addStep({ step: 3, name: "Poll Status", method: "GET", url: CONGA_STATUS_URL+"/"+corrId, status: "pending", body: "—", resp: null, code: null });
        let done = false;
        for (let i=0;i<10;i++) {
          await new Promise(r=>setTimeout(r, i===0?2000:3000));
          try {
            const r = await fetch(CONGA_STATUS_URL+"/"+corrId, { headers:{"Authorization":"Bearer "+token,"showDetails":"true"} });
            const d = await r.json().catch(() => null);
            if (r.ok && d?.message==="Completed") { updLast({ status:"success", code:r.status, resp:"Completed" }); done=true; break; }
            else if (r.ok) { updLast({ status:"pending", resp:"Polling #"+(i+1)+"... "+d?.message }); }
            else { updLast({ status:"error", code:r.status, resp:JSON.stringify(d) }); break; }
          } catch(e) { updLast({ status:"error", resp:e.message }); break; }
        }
        if (!done) { updLast(p=>({ ...p, status:p.status==="pending"?"error":p.status, resp:(p.resp||"")+" Timed out." })); setGeneratingDoc(false); return; }

        // Step 4
        addStep({ step: 4, name: "Get Download", method: "GET", url: CONGA_PRESIGNED_URL+"/"+corrId, status: "pending", body: "—", resp: null, code: null });
        try {
          const r = await fetch(CONGA_PRESIGNED_URL+"/"+corrId, { headers:{"Authorization":"Bearer "+token} });
          const d = await r.json().catch(() => null);
          let url=null,fn=null;
          if (d?.preSignedCreateResponseModel?.fileInfoDetailsList?.length>0) { url=d.preSignedCreateResponseModel.fileInfoDetailsList[0].url; fn=d.preSignedCreateResponseModel.fileInfoDetailsList[0].fileName; }
          if (r.ok && url) { setDownloadUrl(url); setDownloadFileName(fn||selectedBrand+" Catalogue.docx"); updLast({ status:"success", code:r.status, resp:"Download ready" }); }
          else { updLast({ status:"success", code:r.status, resp:"Response received — check tech details" }); }
        } catch(e) { updLast({ status:"error", resp:e.message }); }
        setGeneratingDoc(false);
      }

      function handleDownload() {
        if (!downloadUrl || !lastToken) return;
        fetch(downloadUrl, { headers:{"Authorization":"Bearer "+lastToken} })
          .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.blob(); })
          .then(bl => { const b=new Blob([bl],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=downloadFileName||"Catalogue.docx"; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(u),1000); })
          .catch(e => alert("Download failed: "+e.message));
      }

      return (
        <div style={{ minHeight: "100vh", background: L.bg }}>

          {/* HEADER */}
          <header style={{ background: L.white, borderBottom: `1px solid ${L.border}`, position: "sticky", top: 0, zIndex: 100, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
            <div style={{ maxWidth: 1280, margin: "0 auto", padding: "0 24px", display: "flex", alignItems: "center", justifyContent: "space-between", height: 68 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ background: L.red, display: "flex", alignItems: "center", padding: "0 18px", height: 68, marginLeft: -24 }}>
                  <img src="https://www.legrand.co.in/public/images/navigation/logo.png" alt="Legrand" style={{ height: 28, objectFit: "contain", filter: "brightness(10)" }} onError={e => e.target.style.display="none"} />
                </div>
                <div style={{ width: 1, height: 28, background: L.border }} />
                <span style={{ ...hd, fontSize: "14px", fontWeight: 700, color: L.red }}>Brand Catalogue</span>
              </div>
            </div>
          </header>

          <div style={{ maxWidth: 1280, margin: "0 auto", padding: "28px 24px 60px", display: "grid", gridTemplateColumns: "240px 1fr", gap: 28, minHeight: "80vh" }}>

            {/* SIDEBAR — Brand Selector */}
            <aside>
              <div style={{ background: L.white, borderRadius: L.radius, border: `1px solid ${L.border}`, padding: "20px", position: "sticky", top: 96 }}>
                <div style={{ fontSize: "11px", fontWeight: 700, color: L.textLight, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 14, ...hd }}>Brands</div>
                {BRAND_NAMES.map(name => (
                  <button key={name} onClick={() => { setSelectedBrand(name); setShowJSON(false); setApiSteps([]); setDownloadUrl(null); }} style={{ display: "block", width: "100%", textAlign: "left", padding: "12px 14px", border: "none", borderLeft: selectedBrand === name ? `4px solid ${L.red}` : "4px solid transparent", background: selectedBrand === name ? L.redLight : "transparent", color: selectedBrand === name ? L.red : L.text, fontWeight: selectedBrand === name ? 700 : 500, fontSize: "14px", cursor: "pointer", borderRadius: "0 6px 6px 0", marginBottom: 2, transition: "all 0.15s" }}>
                    {name}
                  </button>
                ))}
              </div>
            </aside>

            {/* MAIN */}
            <main>
              {!selectedBrand ? (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "60vh", textAlign: "center" }}>
                  <div>
                    <div style={{ fontSize: "48px", marginBottom: 12 }}>📋</div>
                    <div style={{ ...hd, fontSize: "22px", fontWeight: 700, color: L.dark }}>Select a Brand</div>
                    <div style={{ fontSize: "14px", color: L.textLight, marginTop: 6 }}>Choose from the sidebar to preview the catalogue and generate a document</div>
                  </div>
                </div>
              ) : (
                <div>
                  {/* Brand Video */}
                  {brand.heroVideo && (
                    <div key={selectedBrand + "-video"} style={{ borderRadius: L.radius, overflow: "hidden", marginBottom: 16, background: "#000" }}>
                      <video autoPlay muted loop playsInline style={{ width: "100%", display: "block", maxHeight: 360, objectFit: "cover" }}>
                        <source src={brand.heroVideo} type="video/mp4" />
                      </video>
                    </div>
                  )}

                  {/* Brand Info Banner */}
                  <div style={{ background: L.dark, borderRadius: L.radius, color: "#fff", marginBottom: 24, padding: "32px 32px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 24 }}>
                      <div style={{ flex: "1 1 400px" }}>
                        <div style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", color: L.red, marginBottom: 6 }}>Legrand</div>
                        <h2 style={{ ...hd, fontSize: "32px", fontWeight: 800, margin: "0 0 8px" }}>{selectedBrand}</h2>
                        <p style={{ fontSize: "16px", opacity: 0.7, margin: "0 0 12px" }}>{brand.tagline}</p>
                        <p style={{ fontSize: "13px", opacity: 0.45, lineHeight: 1.7 }}>{brand.description}</p>
                      </div>
                      <div style={{ display: "flex", gap: 14, flexShrink: 0 }}>
                        <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: "8px", padding: "14px 20px", textAlign: "center" }}>
                          <div style={{ fontSize: "24px", fontWeight: 700, ...hd }}>{brand.products.length}</div>
                          <div style={{ fontSize: "10px", opacity: 0.5, textTransform: "uppercase", marginTop: 2 }}>Products</div>
                        </div>
                        <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: "8px", padding: "14px 20px", textAlign: "center" }}>
                          <div style={{ fontSize: "20px", fontWeight: 700, ...hd }}>{fmt(Math.min(...brand.products.map(p=>p.price)))}</div>
                          <div style={{ fontSize: "10px", opacity: 0.5, textTransform: "uppercase", marginTop: 2 }}>From</div>
                        </div>
                        <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: "8px", padding: "14px 20px", textAlign: "center" }}>
                          <div style={{ fontSize: "20px", fontWeight: 700, ...hd }}>{fmt(Math.max(...brand.products.map(p=>p.price)))}</div>
                          <div style={{ fontSize: "10px", opacity: 0.5, textTransform: "uppercase", marginTop: 2 }}>To</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Highlights */}
                  {brand.highlights && brand.highlights.length > 0 && (
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 24 }}>
                      {brand.highlights.map((h, i) => (
                        <div key={selectedBrand + "-hl-" + i} style={{ borderRadius: L.radius, overflow: "hidden", background: "#000" }}>
                          <div style={{ position: "relative", paddingBottom: "85%" }}>
                            {h.img && <img src={h.img} alt={h.caption} style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover", display: "block" }} onError={e => { e.target.parentElement.innerHTML = '<div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px;background:#F5F5F7">Image not found</div>'; }} />}
                            {!h.img && <div style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: L.textLight, fontSize: "13px", background: "#F5F5F7" }}>Image pending</div>}
                            <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "24px 16px 14px", background: "linear-gradient(transparent, rgba(0,0,0,0.7))" }}>
                              <div style={{ fontSize: "13px", fontWeight: 700, color: "#fff", ...hd }}>{h.caption}</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Rate Card Table */}
                  <div style={{ background: L.white, borderRadius: L.radius, border: `1px solid ${L.border}`, overflow: "hidden", marginBottom: 24 }}>
                    <div style={{ padding: "20px 24px 0" }}><div style={{ ...hd, fontSize: "16px", fontWeight: 700, color: L.red }}>Rate Card — {selectedBrand}</div></div>
                    <div style={{ overflowX: "auto", padding: "12px 0" }}>
                      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "13px" }}>
                        <thead><tr style={{ background: L.dark }}>
                          {["#", "Product", "SKU", "MRP", "Dealer Price"].map((h, i) => (
                            <th key={i} style={{ padding: "10px 14px", textAlign: i >= 3 ? "right" : "left", color: "#fff", fontWeight: 700, fontSize: "10px", textTransform: "uppercase", ...hd }}>{h}</th>
                          ))}
                        </tr></thead>
                        <tbody>
                          {brand.products.map((p, i) => (
                            <tr key={i} style={{ background: i%2===0 ? L.white : L.bgAlt, borderBottom: `1px solid ${L.border}` }}>
                              <td style={{ padding: "9px 14px", color: L.textLight }}>{i+1}</td>
                              <td style={{ padding: "9px 14px", fontWeight: 600 }}>{p.name}</td>
                              <td style={{ padding: "9px 14px", fontSize: "11px", color: L.textLight }}>{p.sku}</td>
                              <td style={{ padding: "9px 14px", textAlign: "right", color: L.textLight }}>{fmt(p.mrp)}</td>
                              <td style={{ padding: "9px 14px", textAlign: "right", fontWeight: 700, color: L.red }}>{fmt(p.price)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Actions */}
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 20 }}>
                    <button onClick={handleGenerate} disabled={generatingDoc} style={{ ...btnR, opacity: generatingDoc ? 0.7 : 1 }}>
                      {generatingDoc ? "⏳ Generating..." : "Generate Catalogue Document"}
                    </button>
                    <button onClick={() => setShowJSON(!showJSON)} style={{ ...btnR, background: L.dark }}>{showJSON ? "Hide JSON" : "View JSON"}</button>
                    <button onClick={() => navigator.clipboard.writeText(catalogueJSON)} style={{ ...btnR, background: "transparent", color: L.red, border: `2px solid ${L.red}`, boxShadow: "none" }}>Copy JSON</button>
                  </div>

                  {/* Download */}
                  {downloadUrl && (
                    <div style={{ display: "inline-flex", alignItems: "center", gap: 12, background: L.white, border: `2px solid ${L.red}`, borderRadius: L.radius, padding: "14px 24px", marginBottom: 20 }}>
                      <span style={{ fontSize: "28px" }}>📄</span>
                      <div><div style={{ fontSize: "14px", fontWeight: 700 }}>{downloadFileName}</div><div style={{ fontSize: "11px", color: L.textLight }}>Ready</div></div>
                      <button onClick={handleDownload} style={{ ...btnR, padding: "10px 20px" }}>⬇ Download</button>
                    </div>
                  )}

                  {/* API Steps */}
                  {apiSteps.length > 0 && (
                    <div style={{ marginBottom: 20 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                        <span style={{ fontSize: "13px", fontWeight: 700, color: L.red, ...hd }}>API Status</span>
                        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: "12px", color: L.textLight, cursor: "pointer" }}>
                          <input type="checkbox" checked={showTech} onChange={e => setShowTech(e.target.checked)} style={{ accentColor: L.red }} /> Details
                        </label>
                      </div>
                      {apiSteps.map((s, i) => (
                        <div key={i} style={{ background: L.white, borderRadius: "6px", border: `1px solid ${s.status==="success"?"#86EFAC":s.status==="error"?"#FCA5A5":L.border}`, padding: "10px 14px", marginBottom: 6, fontSize: "13px" }}>
                          <span style={{ fontWeight: 700, marginRight: 8 }}>Step {s.step}:</span> {s.name}
                          <span style={{ float: "right", fontSize: "11px", fontWeight: 700, padding: "2px 8px", borderRadius: "4px", background: s.status==="success"?"#DEF7DE":s.status==="error"?"#FEE2E2":"#FEF3C7", color: s.status==="success"?"#166534":s.status==="error"?"#991B1B":"#92400E" }}>{s.status}</span>
                          {showTech && <div style={{ fontSize: "11px", color: L.textLight, marginTop: 6 }}>{s.method} {s.url}<br/>→ {s.resp || "..."}</div>}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* JSON */}
                  {showJSON && (
                    <pre style={{ background: L.dark, color: "#FFA8A8", borderRadius: L.radius, padding: 24, fontSize: "12px", lineHeight: 1.7, overflow: "auto", maxHeight: 500, fontFamily: "'Fira Code', monospace" }}>{catalogueJSON}</pre>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* FOOTER */}
          <footer style={{ background: L.dark, color: "#fff", padding: "28px 24px", textAlign: "center" }}>
            <div style={{ display: "inline-block", background: L.red, padding: "8px 20px", marginBottom: 10 }}>
              <img src="https://www.legrand.co.in/public/images/navigation/logo.png" alt="Legrand" style={{ height: 24, objectFit: "contain", filter: "brightness(10)" }} onError={e => e.target.style.display="none"} />
            </div>
            <div style={{ fontSize: "12px", opacity: 0.5 }}>Legrand India — Specialist in Electrical and Digital Building Infrastructures</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
